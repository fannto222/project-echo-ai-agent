name: Refresh YouTube analytics snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth
      - run: python -m src.analytics
      - name: Commit analytics snapshot
        run: |
          git config user.name "youtube-ai-agent"
          git config user.email "youtube-ai-agent@users.noreply.github.com"
          git add data/analytics.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Refresh YouTube analytics"
            git push
          fi
