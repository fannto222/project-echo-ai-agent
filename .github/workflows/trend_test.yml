name: Test Trend Scout

on:
  workflow_dispatch:

jobs:
  trend-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.5-flash-lite

      MAX_MONTHLY_SPEND_EUR: "0"
      ALLOW_PAID_APIS: "false"
      ALLOW_PAID_ADS: "false"

      TREND_REGIONS: US,GB,CA,AU
      TREND_LANGUAGE: en
      TREND_LOOKBACK_HOURS: "48"
      TREND_MAX_SIGNALS: "6"

      CHANNEL_LANGUAGE: en
      CHANNEL_NICHE: trend-led faceless storytelling, curiosity, visual explainers, POV, mystery and science
      CHANNEL_BRAND: Project Echo

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run Trend Scout
        run: python -m src.trend_scout

      - name: Upload trend report
        uses: actions/upload-artifact@v4
        with:
          name: project-echo-trend-report
          path: output/trend_report.json
          retention-days: 1
