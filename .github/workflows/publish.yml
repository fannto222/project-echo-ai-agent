name: Generate and publish

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Content type
        required: true
        default: short
        type: choice
        options: [short, long]
  schedule:
    # UTC. In summer Europe/Rome is UTC+2; in winter these slots shift by one hour.
    - cron: '30 9 * * *'   # Short
    - cron: '30 12 * * *'  # Short
    - cron: '30 15 * * *'  # Short
    - cron: '0 18 * * *'   # Long
    - cron: '0 20 * * *'   # Short
    - cron: '0 22 * * *'   # Optional Short

permissions:
  contents: write

concurrency:
  group: youtube-ai-publisher
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.5-flash-lite
      GEMINI_TTS_MODEL: gemini-2.5-flash-preview-tts
      GEMINI_TTS_VOICE: Kore
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: private
      YOUTUBE_CATEGORY_ID: '24'
      YOUTUBE_MADE_FOR_KIDS: 'false'
      MAX_MONTHLY_SPEND_EUR: '0'
      ALLOW_PAID_APIS: 'false'
      ALLOW_PAID_ADS: 'false'
      CHANNEL_LANGUAGE: en
      CHANNEL_NICHE: sci-fi mystery what-if storytelling
      CHANNEL_BRAND: Project Echo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Resolve scheduled content type
        id: kind
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" = "18" ]; then
            echo "value=long" >> "$GITHUB_OUTPUT"
          else
            echo "value=short" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate, render, and upload privately
        run: python -m src.main --kind "${{ steps.kind.outputs.value }}" --upload

      - name: Save channel memory
        run: |
          git config user.name "youtube-ai-agent"
          git config user.email "youtube-ai-agent@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AI channel memory"
            git push
          fi

      - name: Keep production output as temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-${{ steps.kind.outputs.value }}
          path: output/
          retention-days: 1
